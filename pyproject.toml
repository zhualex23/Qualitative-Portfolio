[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"
[project]
name = "quantitative-portfolio-project"
version = "1.0.0"
description = "Reproducible four-strategy ETF portfolio backtest (JHU 553.647 Group 3)"
requires-python = ">=3.10"
dependencies = ["numpy>=1.24", "pandas>=2.0", "matplotlib>=3.7"]
[project.optional-dependencies]
dev = ["pytest>=7.4"]
[project.scripts]
qp-backtest = "quant_portfolio.cli:main"
[tool.setuptools.packages.find]
where = ["src"]
[tool.pytest.ini_options]
pythonpath = ["src"]
